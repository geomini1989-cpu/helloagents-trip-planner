name: Live Agent Eval

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-eval.yml"

jobs:
  live-eval:
    name: Live LLM + AMap + Local Knowledge Eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      LLM_MODEL_ID: qwen-plus
      OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      OPENAI_MODEL: qwen-plus
      AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight secrets
        id: preflight
        shell: bash
        run: |
          if [[ -z "$LLM_API_KEY" || -z "$AMAP_API_KEY" || -z "$TAVILY_API_KEY" ]]; then
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            echo "Live Eval skipped: LLM_API_KEY, AMAP_API_KEY and TAVILY_API_KEY are required for the complete Agent pipeline."
          else
            echo "can_run=true" >> "$GITHUB_OUTPUT"
            echo "Live Eval credentials detected. Running three real cases with LLM, AMap and Local Knowledge web retrieval."
          fi

      - name: Run live eval (3 cases)
        if: steps.preflight.outputs.can_run == 'true'
        run: python -m evals.run_eval --limit 3 --output evals/reports/live.json

      - name: Upload live eval report
        if: steps.preflight.outputs.can_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-eval-report
          path: backend/evals/reports/live.json
          if-no-files-found: warn

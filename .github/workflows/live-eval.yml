name: Live Agent Eval

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-eval.yml"

jobs:
  live-eval:
    name: Live Routing + Agent Eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      LLM_MODEL_ID: qwen-plus
      OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      OPENAI_MODEL: qwen-plus
      AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight secrets
        id: preflight
        shell: bash
        run: |
          if [[ -n "$LLM_API_KEY" ]]; then
            echo "can_route=true" >> "$GITHUB_OUTPUT"
            echo "Coordinator routing eval enabled."
          else
            echo "can_route=false" >> "$GITHUB_OUTPUT"
            echo "Routing Eval skipped: LLM_API_KEY is not configured."
          fi

          if [[ -n "$LLM_API_KEY" && -n "$AMAP_API_KEY" && -n "$TAVILY_API_KEY" ]]; then
            echo "can_full=true" >> "$GITHUB_OUTPUT"
            echo "Full Live Eval enabled with LLM, AMap and Local Knowledge retrieval."
          else
            echo "can_full=false" >> "$GITHUB_OUTPUT"
            echo "Full Live Eval skipped: LLM_API_KEY, AMAP_API_KEY and TAVILY_API_KEY are all required."
          fi

      - name: Run Coordinator routing eval
        if: steps.preflight.outputs.can_route == 'true'
        run: python -m evals.run_routing_eval --output evals/reports/routing-live.json

      - name: Run full live eval (3 cases)
        if: steps.preflight.outputs.can_full == 'true'
        run: python -m evals.run_eval --limit 3 --output evals/reports/live.json

      - name: Upload routing eval report
        if: steps.preflight.outputs.can_route == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-routing-eval-report
          path: backend/evals/reports/routing-live.json
          if-no-files-found: warn

      - name: Upload full live eval report
        if: steps.preflight.outputs.can_full == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-eval-report
          path: backend/evals/reports/live.json
          if-no-files-found: warn
